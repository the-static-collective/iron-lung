name: Iron Lung COMPASS-003 semantic content instead of role headers
on:
  push:
    branches: [experiment/compass-content-005]
  pull_request:
    paths:
      - src/content-compass.ts
      - scripts/content-compass.ts
      - test/content-compass.test.ts
      - package.json
      - .github/workflows/content-compass.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Full original owner tests, fact/idea/relation content and conditional You
        run: npm run check
