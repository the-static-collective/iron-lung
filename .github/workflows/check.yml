name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Verify deterministic first breath
        run: |
          npm run --silent first-breath > /tmp/iron-lung-breath-1.json
          npm run --silent first-breath > /tmp/iron-lung-breath-2.json
          cmp /tmp/iron-lung-breath-1.json /tmp/iron-lung-breath-2.json
